<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch trình</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <link rel="icon" href="icon-192.png">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 94%;
            table-layout: fixed;
            background: white;
        }

        th, td {
            border: 1px solid #999;
            height: 36px;
            padding: 3px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        th { background: #eeeeee; }

        th:nth-child(1) { width: 20%; }
        th:nth-child(2) { width: 50%; }
        th:nth-child(3) { width: 30%; }

        td.cell {
            padding: 0;
            text-align: left;
        }

        .wrap {
            display: flex;
            align-items: stretch;
            min-height: 36px;
        }

        tbody td { background: var(--row, transparent); }

        .handle {
            flex: 0 0 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            background: rgba(255, 255, 255, 0.45);
            border-right: 1px solid #ddd;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .handle:active { cursor: grabbing; }

        .handle.locked { cursor: not-allowed; font-size: 11px; }

        .content {
            flex: 1;
            min-width: 0;
            padding: 3px 6px;
            min-height: 36px;
            cursor: text;
            outline: none;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .content:focus {
            outline: 2px solid #4a90e2;
            outline-offset: -2px;
            background: #f0f7ff;
        }

        td.cell.dragging { opacity: 0.4; }
        td.cell.over { background: #d9ecff; outline: 2px dashed #4a90e2; outline-offset: -2px; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Giờ</th>
                <th>Công việc</th>
                <th>Dự phòng</th>
            </tr>
        </thead>
        <tbody id="schedule"></tbody>
    </table>

    <script>
        const KEY = "schedule-data-v1";
        const schedule = document.getElementById("schedule");

        // Đọc dữ liệu đã lưu
        let saved = [];
        try { saved = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

        // Màu cố định theo giờ. Hàng đỏ bị khóa: chỉ nhập chữ, không kéo thả.
        // R = đỏ, Y = vàng, G = xanh lá
        const COLOR_VALUES = { R: "#ffb3b3", Y: "#fff3a3", G: "#b8e6b8" };
        const YELLOW_HOURS = [7, 9, 10, 14, 15, 16, 17, 19];
        const GREEN_HOURS = [6, 8, 11, 12, 13, 18, 20, 21];
        const COLOR_KEY = "schedule-colors-v1";

        let savedColors = [];
        try { savedColors = JSON.parse(localStorage.getItem(COLOR_KEY)) || []; } catch (e) {}

        function initialColor(hour) {
            if (YELLOW_HOURS.includes(hour) || GREEN_HOURS.includes(hour)) {
                const s = savedColors[hour];
                if (s === "Y" || s === "G") return s; // màu đã bị hoán đổi trước đó
                return YELLOW_HOURS.includes(hour) ? "Y" : "G";
            }
            return "R"; // 22h - 5h luôn đỏ
        }

        function setRowColor(row, key) {
            row.dataset.color = key;
            row.style.setProperty("--row", COLOR_VALUES[key]);
        }

        function cellHTML(locked) {
            return `<td class="cell"><div class="wrap">
                <span class="handle${locked ? " locked" : ""}" title="${locked ? "Đã khóa" : "Kéo để hoán đổi"}">${locked ? "🔒" : "⠿"}</span>
                <div class="content" contenteditable="true"></div>
            </div></td>`;
        }

        for (let hour = 0; hour < 24; hour++) {
            const colorKey = initialColor(hour);
            const locked = colorKey === "R";
            const row = document.createElement("tr");
            setRowColor(row, colorKey);
            if (locked) row.dataset.locked = "1";
            row.innerHTML = `<td>${String(hour).padStart(2, "0")}h</td>` + cellHTML(locked) + cellHTML(locked);
            const contents = row.querySelectorAll(".content");
            contents[0].textContent = (saved[hour] && saved[hour][0]) || "";
            contents[1].textContent = (saved[hour] && saved[hour][1]) || "";
            schedule.appendChild(row);
        }

        // Lưu vào localStorage
        function save() {
            const data = [...schedule.rows].map(r => {
                const c = r.querySelectorAll(".content");
                return [c[0].innerText.replace(/\n$/, ""), c[1].innerText.replace(/\n$/, "")];
            });
            try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
            try { localStorage.setItem(COLOR_KEY, JSON.stringify([...schedule.rows].map(r => r.dataset.color))); } catch (e) {}
        }

        schedule.addEventListener("input", save);

        // Dán chỉ lấy chữ thường
        schedule.addEventListener("paste", e => {
            if (!e.target.classList.contains("content")) return;
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData("text/plain");
            document.execCommand("insertText", false, text);
        });

        // Kéo thả hoán đổi (chuột + cảm ứng)
        let dragCell = null;
        let overCell = null;

        schedule.addEventListener("pointerdown", e => {
            const handle = e.target.closest(".handle");
            if (!handle || handle.closest("tr").dataset.locked) return;
            e.preventDefault();
            dragCell = handle.closest("td.cell");
            dragCell.classList.add("dragging");
            handle.setPointerCapture(e.pointerId);
        });

        schedule.addEventListener("pointermove", e => {
            if (!dragCell) return;
            const el = document.elementFromPoint(e.clientX, e.clientY);
            let target = el ? el.closest("td.cell") : null;
            if (target && target.closest("tr").dataset.locked) target = null; // không thả vào hàng đỏ
            if (overCell && overCell !== target) overCell.classList.remove("over");
            overCell = target && target !== dragCell ? target : null;
            if (overCell) overCell.classList.add("over");
        });

        function endDrag() {
            if (!dragCell) return;
            if (overCell) {
                const a = dragCell.querySelector(".content");
                const b = overCell.querySelector(".content");
                const tmp = a.textContent;
                a.textContent = b.textContent;
                b.textContent = tmp;

                // Đổi giữa 2 ô cột Công việc (cellIndex 1) thì 2 hàng đổi màu cho nhau.
                // Nếu có ô Dự phòng tham gia thì màu giữ nguyên.
                const rowA = dragCell.closest("tr"), rowB = overCell.closest("tr");
                if (dragCell.cellIndex === 1 && overCell.cellIndex === 1 &&
                    rowA.dataset.color !== rowB.dataset.color) {
                    const colorA = rowA.dataset.color;
                    setRowColor(rowA, rowB.dataset.color);
                    setRowColor(rowB, colorA);
                }
                save();
            }
            dragCell.classList.remove("dragging");
            if (overCell) overCell.classList.remove("over");
            dragCell = overCell = null;
        }

        schedule.addEventListener("pointerup", endDrag);
        schedule.addEventListener("pointercancel", endDrag);

        // Đăng ký service worker để chạy offline và cài được như app
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
    </script>
</body>
</html>
